<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checked</title>

    <style>
        .toggle-input{
        display:none}
    </style>
</head>
<body>
    <div class="card">
        <h2>3. Evento <code>:checked</code>(Abrir/Fechar no Clique)</h2>
        <input type="checkbox" id="meu-toggle" class="toggle-input">
        <label for="meu-toggle" class="btn-toggle">Clique para toggle</label>

        <div class="painel-oculto">
            <p>Surpresa! Este conteúdo foi exibido **sem usar javascript**,
                apenas usando a pseudo-classe
                <code>:checked</code> do CSS.
            </p>
        </div>
    </div>
</body>
</html>
